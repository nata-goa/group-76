
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>დავალება 3</title>
    <style>
        
        .parent {
            font-size: 30px;
            color: blue;
            background-color: green;

            border: 5px solid purple;
            padding: 20px;

            text-align: center;
        }

        .special {
            font-size: 20px;
            color: yellow;
            background-color: blue;

            border: 3px solid red;

            text-align: right;
        }
    </style>
</head>
<body>

    <div class="parent">
        <h1> caption first </h1>
        <h2 class="special"> caption second </h2>
        <h3> caption third </h3>

        <p class="special"> paragraph first</p>
        <p class="special"> paragraph second </p>
        <p> paragraph third</p>

        <button class="special"> click it</button>
        <button> click </button>
        <button> click </button>
    </div>

</body>
</html>
