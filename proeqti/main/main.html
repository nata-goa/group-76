
<!DOCTYPE html>

<head>

    <style>
        body {

            font-family: Arial, sans-serif;
            /* radial gradient მთელ გვერდზე */
            background: radial-gradient(circle, #f3e3e3, #7f3535);
            color: #333;
        }

        header {
            background: radial-gradient(circle, #7f3535, #4a0f0f);

            font-weight: bold;

        nav a:hover {

            width: 100%;
            border-radius: 8px;
            margin-bottom: 72px;
        }

        button {
            background-color: #7f3535;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #a83232;
        }

        footer {
            background: radial-gradient(circle, #7f3535, #4a0f0f);
            color: rgb(236, 226, 226);
            text-align: center;
            padding: 30px;
            position: fixed;
