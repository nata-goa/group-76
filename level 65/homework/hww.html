<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<style>
#container {
    color: blue;
    font-family: Arial;
    background-color: lightgray;
}

#h1 {
    font-size: 30px;
    text-align: center;
    border: 3px solid red;
}

#h2 {
    font-size: 26px;
    text-align: left;
    border: 3px solid green;
}

#h3 {
    font-size: 22px;
    text-align: right;
    border: 3px solid purple;
}
</style>
</head>

<body>

<div id="container">
    <h1 id="h1"> header first </h1>
    <h2 id="h2"> header second </h2>
    <h3 id="h3"> header third </h3>

    <p> paragraph first</p>
    <p> paragraph second </p>
    <p> paragraph third </p>
</div>

</body>
</html>
